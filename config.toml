baseURL = "https://homigin.github.io/"
defaultContentLanguage = "zh-tw"
locale = "zh-TW"
title = "Homigin's Garden"
theme = "PaperMod"
enableRobotsTXT = true
canonifyURLs = true

[pagination]
  pagerSize = 10

[params]
  [params.author]
    name = "Homigin"
    email = "dr.chiayuan.chen@gmail.com"

  [params.homeInfoParams]
    Title = "關於我"
    Content = """
嗨，若是偶然走到這裡，歡迎來看看。

這裡是一個放筆記、放半成品想法、放還在整理中的學習痕跡的地方。主題不算專一，常常從醫學出發，也會一路岔到音樂、投資、程式，還有各種和學習、工作流程有關的東西。

這個網站受到 swyx 的 Learn in Public 影響很深。學習不一定要等到整理完成才分享，有時候把過程攤開來，本身就是整理的一部分。希望把骨科知識、課程筆記、臨床學習、AI workflow，還有一路上覺得有意思的東西，慢慢放到這裡。
"""

  ShowReadingTime = true
  ShowWordCount = true
  ShowCodeCopyButtons = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowToc = true

  defaultTheme = "auto"
  disableThemeToggle = false
  ShowLanguageSwitcher = false
  DateFormat = "2006-01-02"

  ShowFooter = true
  footer = "© 2026 Homigin • Built with Hugo + PaperMod"

  socialIcons = [
    { name = "github", url = "https://github.com/homigin" },
    { name = "email", url = "mailto:dr.chiayuan.chen@gmail.com" },
    { name = "rss", url = "https://homigin.github.io/index.xml" }
  ]

[markup.goldmark.renderer]
  unsafe = true

