baseURL = "https://homigin.github.io/"
defaultContentLanguage = "zh-tw"
locale = "zh-TW"
title = "Homigin's Garden"
theme = "PaperMod"
enableRobotsTXT = true
canonifyURLs = true

[pagination]
  pagerSize = 10

[params]
  [params.author]
    name = "Homigin"
    email = "dr.chiayuan.chen@gmail.com"

  [params.homeInfoParams]
    Title = "Chia-Yuan Chen / Homigin"
    Content = """
骨科住院醫師。整理骨科學習、臨床筆記與 AI workflow。

我把自己正在學的東西公開，也把重複麻煩的流程做成小工具。這裡會放醫學筆記、課程心得、工具作品、好用資源，還有一些音樂、投資、程式與學習方法的旁支。

[讀文章](/) · [看工具](/tools/) · [資源清單](/resources/) · [關於我](/about/)
"""

  ShowReadingTime = true
  ShowWordCount = true
  ShowCodeCopyButtons = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowToc = true

  defaultTheme = "auto"
  disableThemeToggle = false
  ShowLanguageSwitcher = false
  DateFormat = "2006-01-02"

  ShowFooter = true
  footer = "© 2026 Homigin • Built with Hugo + PaperMod"

  socialIcons = [
    { name = "github", url = "https://github.com/homigin" },
    { name = "email", url = "mailto:dr.chiayuan.chen@gmail.com" },
    { name = "rss", url = "https://homigin.github.io/index.xml" }
  ]

[markup.goldmark.renderer]
  unsafe = true

[[menu.main]]
  identifier = "posts"
  name = "文章"
  url = "/"
  weight = 1

[[menu.main]]
  identifier = "tools"
  name = "工具"
  url = "/tools/"
  weight = 2

[[menu.main]]
  identifier = "resources"
  name = "資源"
  url = "/resources/"
  weight = 3

[[menu.main]]
  identifier = "ortho-course-radar"
  name = "骨科雷達"
  url = "/ortho-course-radar/"
  weight = 4

[[menu.main]]
  identifier = "about"
  name = "關於我"
  url = "/about/"
  weight = 5
